[project]
name = "minimal-terminal-agent"
version = "0.1.0"
description = "MTA: a minimal, readable terminal-use agent for research"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
# Only needed to run benchmarks through Harbor; the core agent never imports it.
harbor = ["harbor==0.25.0", "pyyaml"]
# Harbor plus Modal cloud sandboxes (`-e mta.integrations.harbor.modal_env:ModalEnvironment`).
modal = ["harbor[modal]==0.25.0", "pyyaml"]
# Harbor plus Daytona cloud sandboxes (`-e mta.integrations.harbor.daytona:DaytonaEnvironment`).
daytona = ["harbor[daytona]==0.25.0", "pyyaml"]

[project.urls]
Repository = "https://github.com/Eric2i/minimal-terminal-agent"

[project.scripts]
mta = "mta.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
